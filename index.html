<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruta Emprendedora - Iniciar Sesión</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #00324D;
      color: #ffffff;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-size: 1.5rem;
    }
    .user-info {
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .btn-logout {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-logout:hover {
      background: #c0392b;
    }
    .container {
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }
    .card {
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
      margin-bottom: 20px;
    }
    .auth-card {
      max-width: 400px;
      margin: 40px auto;
    }
    .auth-card h2 {
      margin-top: 0;
      color: #00324D;
      text-align: center;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #333;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1rem;
    }
    .btn-primary {
      width: 100%;
      background-color: #00324D;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 5px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-primary:hover {
      background-color: #002133;
    }
    .auth-toggle {
      text-align: center;
      margin-top: 15px;
      font-size: 0.9rem;
    }
    .auth-toggle a {
      color: #00324D;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }
    .auth-toggle a:hover {
      text-decoration: underline;
    }
    .error-message {
      color: #d9534f;
      font-size: 0.88rem;
      margin-top: 10px;
      text-align: center;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Encabezado -->
  <header>
    <h1>Ruta Emprendedora</h1>
    <div id="user-info" class="user-info hidden">
      <span id="user-email"></span>
      <button id="btn-logout" class="btn-logout">Cerrar Sesión</button>
    </div>
  </header>

  <div class="container">
    
    <!-- Módulo de Autenticación (Correo y Contraseña) -->
    <div id="auth-section" class="card auth-card">
      <h2 id="auth-title">Iniciar Sesión</h2>
      
      <form id="auth-form">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" required placeholder="correo@ejemplo.com">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required placeholder="******">
        </div>
        <button type="submit" id="btn-auth-submit" class="btn-primary">Ingresar</button>
      </form>

      <div id="auth-error" class="error-message"></div>

      <div class="auth-toggle">
        <span id="toggle-text">¿No tienes una cuenta?</span>
        <a id="toggle-link">Registrarse</a>
      </div>
    </div>

    <!-- Contenido Protegido del Dashboard -->
    <div id="dashboard-section" class="hidden">
      <div class="grid">
        <div class="card">
          <h3>Inscritos</h3>
          <h2 id="i">4000</h2>
        </div>
        <div class="card">
          <h3>Activos</h3>
          <h2 id="a">3250</h2>
        </div>
        <div class="card">
          <h3>Condonados</h3>
          <h2 id="c">135</h2>
        </div>
      </div>

      <div class="card">
        <h2>Prototipo Web</h2>
        <p>Sistema de seguimiento y control de la Ruta Emprendedora.</p>
      </div>
    </div>

  </div>

  <!-- Script Firebase (Modulo ES6) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-analytics.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

    // Configuración de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAYYndyyY0xxfctyMXkYZLa3-okK-ZrFQ8",
      authDomain: "ruta-emprendedora-cidt.firebaseapp.com",
      projectId: "ruta-emprendedora-cidt",
      storageBucket: "ruta-emprendedora-cidt.firebasestorage.app",
      messagingSenderId: "875498036199",
      appId: "1:875498036199:web:bbc00f38c0ff70cfd73b42",
      measurementId: "G-D28GE4ZYVB"
    };

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);

    // Variables de interfaz
    let isLoginMode = true;

    const authSection = document.getElementById("auth-section");
    const dashboardSection = document.getElementById("dashboard-section");
    const authForm = document.getElementById("auth-form");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const authTitle = document.getElementById("auth-title");
    const btnSubmit = document.getElementById("btn-auth-submit");
    const authError = document.getElementById("auth-error");
    const toggleText = document.getElementById("toggle-text");
    const toggleLink = document.getElementById("toggle-link");
    const userInfo = document.getElementById("user-info");
    const userEmailSpan = document.getElementById("user-email");
    const btnLogout = document.getElementById("btn-logout");

    // Alternar entre Inicio de Sesión y Registro
    toggleLink.addEventListener("click", () => {
      isLoginMode = !isLoginMode;
      authError.textContent = "";
      if (isLoginMode) {
        authTitle.textContent = "Iniciar Sesión";
        btnSubmit.textContent = "Ingresar";
        toggleText.textContent = "¿No tienes una cuenta?";
        toggleLink.textContent = "Registrarse";
      } else {
        authTitle.textContent = "Crear Cuenta";
        btnSubmit.textContent = "Registrarse";
        toggleText.textContent = "¿Ya tienes una cuenta?";
        toggleLink.textContent = "Iniciar Sesión";
      }
    });

    // Manejo de envío del formulario
    authForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      authError.textContent = "";

      const email = emailInput.value;
      const password = passwordInput.value;

      try {
        if (isLoginMode) {
          await signInWithEmailAndPassword(auth, email, password);
        } else {
          await createUserWithEmailAndPassword(auth, email, password);
        }
        authForm.reset();
      } catch (error) {
        switch (error.code) {
          case "auth/invalid-email":
            authError.textContent = "El formato de correo no es válido.";
            break;
          case "auth/user-not-found":
          case "auth/wrong-password":
          case "auth/invalid-credential":
            authError.textContent = "Correo o contraseña incorrectos.";
            break;
          case "auth/email-already-in-use":
            authError.textContent = "Este correo ya se encuentra registrado.";
            break;
          case "auth/weak-password":
            authError.textContent = "La contraseña debe tener al menos 6 caracteres.";
            break;
          default:
            authError.textContent = "Error: " + error.message;
        }
      }
    });

    // Cerrar sesión
    btnLogout.addEventListener("click", async () => {
      try {
        await signOut(auth);
      } catch (error) {
        console.error("Error al cerrar sesión:", error);
      }
    });

    // Listener para cambios de estado de autenticación
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // Usuario autenticado
        authSection.classList.add("hidden");
        dashboardSection.classList.remove("hidden");
        userInfo.classList.remove("hidden");
        userEmailSpan.textContent = user.email;
      } else {
        // Usuario no autenticado
        authSection.classList.remove("hidden");
        dashboardSection.classList.add("hidden");
        userInfo.classList.add("hidden");
        userEmailSpan.textContent = "";
      }
    });
  </script>
</body>
</html>
